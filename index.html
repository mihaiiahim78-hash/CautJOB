<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobiQ - Joburi Individuale și Recenzii Verificate</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://cse.google.com/cse.js?cx=858f8733d2e804bd8"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            line-height: 1.6;
        }
        header.hero {
            background: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.88)), 
                        url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: #ffffff;
            padding: 4rem 1.5rem 5rem;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }
        .hero p {
            font-size: 1.15rem;
            color: #cbd5e1;
            max-width: 650px;
            margin: 0 auto;
        }
        .container {
            max-width: 1050px;
            margin: -2.5rem auto 3rem;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }
        .card h2 {
            font-size: 1.35rem;
            margin-bottom: 1.2rem;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.6rem;
        }
        .search-grid {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.2fr auto;
            gap: 0.85rem;
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.35rem;
        }
        input, select, textarea {
            padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
        }
        button.btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.78rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.btn-primary:hover {
            background-color: #1d4ed8;
        }
        .tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            padding: 0.65rem 1.25rem;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .review-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .badge-verified {
            background: #dcfce7;
            color: #166534;
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #64748b;
            font-size: 0.85rem;
        }
        @media (max-width: 768px) {
            .search-grid {
                grid-template-columns: 1fr;
            }
            .hero h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>JobiQ — Cariera ta, fără compromisuri</h1>
        <p>Descoperă joburi reale, filtrează rapid după program și citește recenzii verificate de la angajați.</p>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('jobs', this)">Caută Joburi</button>
            <button class="tab-btn" onclick="switchTab('reviews', this)">Recenzii Angajatori</button>
        </div>

        <div id="tab-jobs" class="card">
            <h2>Căutare Avansată Joburi</h2>
            <div class="search-grid">
                <div class="form-group">
                    <label for="jobQuery">Funcție / Domeniu</label>
                    <input type="text" id="jobQuery" placeholder="ex: Șofer, Contabil, IT...">
                </div>
                <div class="form-group">
                    <label for="jobCity">Oraș</label>
                    <input type="text" id="jobCity" placeholder="ex: Arad, București, Cluj...">
                </div>
                <div class="form-group">
                    <label for="jobType">Program de lucru</label>
                    <select id="jobType">
                        <option value="">Toate tipurile</option>
                        <option value="full time">Full-time</option>
                        <option value="part time">Part-time</option>
                        <option value="remote">Remote / De acasă</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="executeJobSearch()">Caută</button>
            </div>
            <div id="cse-results" style="margin-top: 1.5rem;">
                <div class="gcse-searchresults-only" data-gname="jobiqSearch"></div>
            </div>
        </div>

        <div id="tab-reviews" class="card" style="display: none;">
            <h2>Recenzii Verificate Companii</h2>
            <form id="reviewForm" onsubmit="submitReview(event)" style="display: grid; gap: 0.85rem; margin-bottom: 2rem;">
                <input type="text" id="revCompany" placeholder="Numele companiei" required>
                <input type="text" id="revCity" placeholder="Orașul" required>
                <select id="revRating" required>
                    <option value="">Alege nota (1 - 5)</option>
                    <option value="5">5 - Excelent</option>
                    <option value="4">4 - Foarte bine</option>
                    <option value="3">3 - Mediu</option>
                    <option value="2">2 - Slab</option>
                    <option value="1">1 - De evitat</option>
                </select>
                <input type="tel" id="revPhone" placeholder="Număr de telefon (pentru verificare)" required>
                <textarea id="revComment" rows="3" placeholder="Scrie experiența ta..." required></textarea>
                <label style="font-size: 0.85rem; color: #475569;">
                    <input type="checkbox" required> Sunt de acord cu prelucrarea datelor conform politicii GDPR.
                </label>
                <button type="submit" class="btn-primary">Trimite Recenzia</button>
            </form>
            <div id="reviewsList"><p>Se încarcă recenziile...</p></div>
        </div>
    </div>

    <footer>
        &copy; 2026 JobiQ România. Toate drepturile rezervate. | Platformă conformă GDPR.
    </footer>

    <script>
        const SUPABASE_URL = 'URL_UL_TAU_SUPABASE';
        const SUPABASE_ANON_KEY = 'CHEIA_TA_ANON_SUPABASE';
        const db = (SUPABASE_URL.startsWith('http')) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function switchTab(tabName, btn) {
            document.getElementById('tab-jobs').style.display = tabName === 'jobs' ? 'block' : 'none';
            document.getElementById('tab-reviews').style.display = tabName === 'reviews' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tabName === 'reviews') loadReviews();
        }

        function executeJobSearch() {
            const q = document.getElementById('jobQuery').value.trim();
            const city = document.getElementById('jobCity').value.trim();
            const type = document.getElementById('jobType').value.trim();
            const fullQuery = [q, city, type, 'angajari job'].filter(Boolean).join(' ');
            if (window.google && google.search && google.search.cse) {
                const element = google.search.cse.element.getElement('jobiqSearch');
                if (element) element.execute(fullQuery);
            }
        }

        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            if (!db) {
                list.innerHTML = '<p>Configurează datele Supabase în cod pentru a afișa recenziile.</p>';
                return;
            }
            const { data, error } = await db.from('recenzii').select('*').eq('aprobat', true).order('id', { ascending: false });
            if (error || !data || data.length === 0) {
                list.innerHTML = '<p>Nu există încă recenzii aprobate.</p>';
                return;
            }
            list.innerHTML = data.map(r => `
                <div class="review-item">
                    <strong>${r.companie}</strong> (${r.oras}) — Nota: <strong>${r.nota}/5</strong>
                    ${r.telefon_verificat ? '<span class="badge-verified">Telefon verificat</span>' : ''}
                    <p style="margin-top: 0.4rem;">${r.comentariu}</p>
                </div>
            `).join('');
        }

        async function submitReview(e) {
            e.preventDefault();
            if (!db) {
                alert('Configurează datele Supabase în cod înainte de a trimite recenzii.');
                return;
            }
            const payload = {
                companie: document.getElementById('revCompany').value.trim(),
                oras: document.getElementById('revCity').value.trim(),
                nota: parseInt(document.getElementById('revRating').value, 10),
                comentariu: document.getElementById('revComment').value.trim(),
                telefon_verificat: false,
                aprobat: false
            };
            const { error } = await db.from('recenzii').insert([payload]);
            if (error) {
                alert('Eroare la trimitere: ' + error.message);
            } else {
                alert('Recenzia a fost trimisă și așteaptă aprobarea!');
                document.getElementById('reviewForm').reset();
            }
        }
    </script>
</body>
</html>
